name: Build & deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # 1. Build de l'image + test de fumée (sur chaque push et PR)
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: SEO + agent-friendly (.md, llms.txt, sitemap, JSON-LD)
        run: python3 scripts/check_seo_agents.py

      - name: Build
        run: |
          docker build -t bytetuto-site:ci .
          docker build -t bytetuto-api:ci api

      - name: Vérifier la conf nginx
        run: docker run --rm bytetuto-site:ci nginx -t

      - name: Test de fumée
        run: |
          docker network create bytetuto
          docker run -d --name api --network bytetuto --network-alias api -e RATE_MAX=8 bytetuto-api:ci
          docker run -d --name web --network bytetuto -p 8080:80 bytetuto-site:ci
          for i in $(seq 1 15); do curl -fsS http://localhost:8080/healthz && break; sleep 1; done
          curl -fsS http://localhost:8080/ | grep -q "byteTuto"
          curl -fsS http://localhost:8080/app.js -o /dev/null
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/nexiste-pas)" = "404"
          curl -sI http://localhost:8080/ | grep -qi "content-security-policy"
          curl -sI http://localhost:8080/index.md | grep -qi "content-type: text/markdown"
          curl -sI http://localhost:8080/index.md | grep -qi "x-robots-tag: noindex"
          curl -fsS -H "Accept: text/markdown" http://localhost:8080/ | head -1 | grep -q "^---"
          curl -fsS http://localhost:8080/llms.txt | head -1 | grep -q "^# byteTuto"
          curl -fsS http://localhost:8080/sitemap.xml | grep -q "<urlset"
          curl -fsS http://localhost:8080/mentions-legales/ | grep -q "Hébergeur"
          curl -fsS http://localhost:8080/confidentialite/ | grep -q "Tes droits"
          curl -sI http://localhost:8080/media/teaser.mp4 | grep -qi "content-type: video/mp4"
          test "$(curl -s -o /dev/null -w '%{http_code}' -r 0-99 http://localhost:8080/media/teaser.webm)" = "206"
          test "$(curl -s -o /dev/null -w '%{http_code}' -X DELETE http://localhost:8080/api/count)" = "403"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/admin/)" = "404"   # admin fermée sans HTTPS
          echo "✔ smoke test OK"

      - name: Inscriptions (API à travers nginx)
        run: |
          for i in $(seq 1 15); do curl -fsS http://localhost:8080/api/health && break; sleep 1; done
          python3 api/test_api.py http://localhost:8080

      - name: HTTPS + page admin (certificat de test)
        run: |
          mkdir -p tls/live/bytetuto.test
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj "/CN=bytetuto.test" \
            -keyout tls/live/bytetuto.test/privkey.pem -out tls/live/bytetuto.test/fullchain.pem 2>/dev/null
          chmod -R a+r tls
          HASH=$(printf 'phrase de passe ci\n' | docker run --rm -i bytetuto-api:ci python app.py hash-password)
          docker network create bt-https
          docker run -d --name api-https --network bt-https --network-alias api \
            -e ADMIN_PASSWORD_HASH="$HASH" -e ADMIN_SECRET="$(openssl rand -hex 32)" bytetuto-api:ci
          docker run -d --name web-https --network bt-https -p 8443:443 -p 8081:80 \
            -e DOMAIN=bytetuto.test -v "$PWD/tls:/etc/letsencrypt:ro" bytetuto-site:ci
          for i in $(seq 1 15); do curl -fsSk https://localhost:8443/healthz >/dev/null 2>&1 && curl -fsSk https://localhost:8443/api/health && break; sleep 1; done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8081/admin/)" = "301"    # HTTP → HTTPS
          curl -sk https://localhost:8443/ | grep -q "byteTuto"
          python3 api/test_admin.py https://localhost:8443 "phrase de passe ci"

      - name: Responsive (Playwright, 320 → 1440 px)
        run: |
          pip install --quiet playwright
          python3 -m playwright install --with-deps chromium
          python3 scripts/check_responsive.py --base http://localhost:8080 --shots responsive-shots

      - name: Captures responsive
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: responsive-shots
          path: responsive-shots
          if-no-files-found: ignore

      - name: Journaux en cas d'échec
        if: failure()
        run: for c in web api web-https api-https; do echo "== $c"; docker logs $c --tail 40 || true; done

      - name: Arrêt des conteneurs
        if: always()
        run: docker rm -f web api web-https api-https || true

  # 2. Publication de l'image sur GitHub Container Registry (main uniquement)
  publish:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.img.outputs.image }}
      api_image: ${{ steps.img.outputs.api_image }}
    steps:
      - uses: actions/checkout@v4

      - name: Nom d'image en minuscules
        id: img
        run: |
          name=$(echo "${REGISTRY}/${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')
          echo "base=$name" >> "$GITHUB_OUTPUT"
          echo "image=$name:${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "api_base=$name-api" >> "$GITHUB_OUTPUT"
          echo "api_image=$name-api:${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64   # EC2 Intel/AMD ou Graviton
          tags: |
            ${{ steps.img.outputs.base }}:latest
            ${{ steps.img.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image du service d'inscription
        uses: docker/build-push-action@v6
        with:
          context: api
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ steps.img.outputs.api_base }}:latest
            ${{ steps.img.outputs.api_image }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

  # 3. Déploiement sur EC2 par SSH
  deploy:
    needs: publish
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://${{ vars.DOMAIN }}
    permissions:
      contents: read
      packages: read
    env:
      APP_DIR: /opt/bytetuto
    steps:
      - uses: actions/checkout@v4

      - name: Clé SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/id_ec2 && chmod 600 ~/.ssh/id_ec2
          if [ -n "$EC2_KNOWN_HOSTS" ]; then
            printf '%s\n' "$EC2_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            echo "::warning::EC2_KNOWN_HOSTS absent — empreinte récupérée à la volée (ssh-keyscan)"
            ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts
          fi

      - name: Copier les fichiers de déploiement
        env:
          TARGET: ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}
        run: |
          ssh -i ~/.ssh/id_ec2 "$TARGET" "mkdir -p $APP_DIR/deploy"
          scp -i ~/.ssh/id_ec2 docker-compose.yml "$TARGET:$APP_DIR/"
          scp -i ~/.ssh/id_ec2 deploy/deploy.sh deploy/init-ssl.sh deploy/set-admin-password.sh "$TARGET:$APP_DIR/deploy/"

      - name: Déployer
        env:
          TARGET: ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}
          IMAGE: ${{ needs.publish.outputs.image }}
          API_IMAGE: ${{ needs.publish.outputs.api_image }}
          DOMAIN: ${{ vars.DOMAIN }}
          LETSENCRYPT_EMAIL: ${{ vars.LETSENCRYPT_EMAIL }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ssh -i ~/.ssh/id_ec2 "$TARGET" bash -s <<SSH
          set -euo pipefail
          cd $APP_DIR
          # ne réécrit que les clés gérées ici : ADMIN_*, COUNTER_MIN… écrites sur le serveur sont conservées
          touch .env
          grep -vE '^(DOMAIN|IMAGE|API_IMAGE|LETSENCRYPT_EMAIL)=' .env > .env.tmp || true
          printf 'DOMAIN=%s\nIMAGE=%s\nAPI_IMAGE=%s\nLETSENCRYPT_EMAIL=%s\n' "$DOMAIN" "$IMAGE" "$API_IMAGE" "$LETSENCRYPT_EMAIL" >> .env.tmp
          mv .env.tmp .env
          chmod 600 .env
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
          bash deploy/deploy.sh
          docker logout ghcr.io
          SSH

      - name: Vérifier en ligne
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          curl -fsS --retry 5 --retry-delay 3 "http://$EC2_HOST/healthz"
          echo "✔ En ligne"
