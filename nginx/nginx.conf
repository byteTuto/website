user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log notice;
pid        /run/nginx.pid;

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - [$time_local] "$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" $request_time';
    access_log /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 65;
    server_tokens   off;
    client_max_body_size 1m;

    # HSTS uniquement en HTTPS (valeur vide = en-tête non envoyé)
    map $scheme $hsts {
        https   "max-age=31536000";
        default "";
    }

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/plain text/markdown text/css application/javascript application/json application/xml image/svg+xml text/xml;

    # UTF-8 déclaré aussi pour le texte brut et le Markdown (llms.txt, *.md)
    charset utf-8;
    charset_types text/plain text/markdown text/css text/xml application/xml application/javascript application/json;

    # Agents IA : « Accept: text/markdown » -> on sert le jumeau .md de la page (voir site.inc)
    map $http_accept $wants_markdown {
        default             0;
        ~*text/markdown     1;
    }

    # Inscriptions : 10 par minute et par IP (rafale de 10), au-delà réponse 429
    limit_req_zone $binary_remote_addr zone=api_subscribe:1m rate=10r/m;
    # Page admin : 30 requêtes par minute et par IP
    limit_req_zone $binary_remote_addr zone=admin:1m rate=30r/m;
    limit_req_status 429;

    include /etc/nginx/conf.d/*.conf;
}
