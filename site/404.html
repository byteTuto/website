<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 — byteTuto</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&family=JetBrains+Mono:wght@500&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
  <style>
    :root { --surface:#0E1116; --ink:#F2F1EC; --muted:#A3A8B3; --line:#2A2F38; --byte:#B8F03C; --on-byte:#0E1116; color-scheme: dark; }
    html,body { margin:0; height:100%; }
    body { background: var(--surface) radial-gradient(circle, var(--line) 1.5px, transparent 1.6px) 0 0 / 36px 36px;
           color: var(--ink); font: 400 16px/26px "IBM Plex Sans", system-ui, sans-serif;
           display:flex; align-items:center; justify-content:center; text-align:center; padding:16px; box-sizing:border-box; }
    .code { font: 700 clamp(72px, 18vw, 160px)/1 "Space Grotesk", system-ui, sans-serif; letter-spacing:-.04em; margin:0; }
    .code span { color: var(--byte); }
    p { color: var(--muted); max-width: 420px; margin: 16px auto 28px; }
    main { width: 100%; max-width: 560px; min-width: 0; }
    pre { font: 500 14px/22px "JetBrains Mono", monospace; color: var(--muted); margin: 0 0 28px; white-space: pre-wrap; overflow-wrap: anywhere; }
    pre b { color: var(--byte); font-weight: 500; }
    a { display:inline-block; background: var(--byte); color: var(--on-byte); font-weight:600; text-decoration:none; padding:12px 18px; border-radius:12px; }
    a:focus-visible { outline: 2px solid var(--byte); outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <h1 class="code">4<span>0</span>4</h1>
    <pre><b>$</b> cd cette-page
bash: cd: cette-page: No such file or directory</pre>
    <p>Cette page n'existe pas (encore). Le site byteTuto est en construction.</p>
    <a href="/">▶_ Retour à l'accueil</a>
  </main>
</body>
</html>
