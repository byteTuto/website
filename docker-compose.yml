# Production (EC2). Le workflow GitHub Actions fournit IMAGE.
# En local : docker compose -f docker-compose.dev.yml up
services:
  web:
    image: ${IMAGE:-ghcr.io/bytetuto/website:latest}
    container_name: bytetuto-web
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-}
      # Sous-domaines servis par d'autres dépôts (voir README §7) : « hote=http://conteneur:port », séparés par des espaces.
      # Mettre EXTRA_SITES= (vide) dans .env pour les désactiver.
      EXTRA_SITES: ${EXTRA_SITES-dashboard.bytetuto.com=http://bytetuto-dashboard:8080}
    networks:
      - default
      - sites                   # pour joindre les conteneurs des autres sites (l'API, elle, n'y est pas)
    volumes:
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # Service d'inscription « Préviens-moi du lancement » (non exposé : joint par nginx sur /api/)
  api:
    image: ${API_IMAGE:-ghcr.io/bytetuto/website-api:latest}
    container_name: bytetuto-api
    restart: unless-stopped
    environment:
      COUNTER_MIN: ${COUNTER_MIN:-30}
      # page /admin/ : écrits par deploy/set-admin-password.sh dans .env (empreinte du mot de passe, jamais le mot de passe)
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}
      ADMIN_SECRET: ${ADMIN_SECRET:-}
    volumes:
      - api-data:/data          # base SQLite des inscrits — à sauvegarder (voir README)
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "3" }

  # Utilisé à la demande par deploy/init-ssl.sh et le cron de renouvellement
  certbot:
    image: certbot/certbot:latest
    profiles: ["certbot"]
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt

volumes:
  api-data:

networks:
  # Réseau partagé avec les autres dépôts (dashboard…). Créé par deploy/deploy.sh s'il n'existe pas.
  sites:
    name: bytetuto-sites
    external: true
